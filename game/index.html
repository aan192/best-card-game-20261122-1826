<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ember &amp; Tide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #173b2a; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; max-width: 100vw; max-height: 100vh; object-fit: contain; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720" aria-label="Ember and Tide: a turn-based elemental card duel"></canvas>
  <div id="status" class="sr-only" aria-live="polite"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
